name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: shellcheck + plutil + bats (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned bats-core and shellcheck
        run: make tools
      - name: Lint and test
        run: make verify
