# Copy to config/settings.toml and adjust. settings.toml is gitignored.
# CLI flags and environment variables override these values.

# "mock" (safe, no network) or "myfitnesspal" (live).
backend = "mock"

# Local state directory (SQLite + session token). Relative paths resolve
# against the current working directory.
home = "./.mfp-sync"

[nutrition]
# Fractional tolerances for flagging planned-vs-matched discrepancies.
# 0.15 == warn when the matched food differs from the plan by more than 15%.
calorie_tolerance = 0.15
protein_tolerance = 0.20
carb_tolerance = 0.20
fat_tolerance = 0.20

[matching]
# Minimum fuzzy-match score (0..1) to auto-accept a food search candidate.
# Below this, `resolve` requires an explicit human choice.
auto_accept_score = 0.92
# How many candidates to display when confidence is insufficient.
max_candidates = 8

[sync]
# Default conflict policy: skip | ask | overwrite.
on_conflict = "ask"
# Transient-error retry budget.
max_retries = 3
retry_base_delay_seconds = 1.0
# Minimum seconds between remote write calls (rate limiting).
min_write_interval_seconds = 0.5
