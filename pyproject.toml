[project]
name = "mfp-weekly-sync"
version = "0.1.0"
description = "Prepopulate a MyFitnessPal food diary from a weekly meal plan (free MFP account, local-only, idempotent)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
    "python-dateutil>=2.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# The live MyFitnessPal backends.
#
# 1. `myfitnesspal` backend — native mobile OAuth (username/password). Requires
#    the mfp-api package, which is NOT on PyPI; install from git:
#      pip install "git+https://github.com/Rift-Walker/mfp-api"
#
# 2. `cookie-session` backend — for accounts that log in via Google/Apple SSO
#    (no password). Reads your existing browser session from Chrome on macOS.
#    Needs `cryptography` to decrypt Chrome's cookie store, and `httpx` for the
#    v2 API (httpx also ships with mfp-api). Install:
#      pip install -e ".[cookie]"
cookie = [
    "cryptography>=41.0.0",
    "httpx>=0.27",
]
# MCP server interface (optional). Lets MCP-capable agents (ChatGPT Desktop,
# Claude Desktop, Cursor, Kiro) call the sync operations as tools.
mcp = [
    "mcp>=1.2,<2.0",
]
live = []
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "freezegun>=1.5",
    "cryptography>=41.0.0",
    "httpx>=0.27",
    "mcp>=1.2,<2.0",
]

[project.scripts]
mfp-sync = "mfp_sync.cli:app"
mfp-sync-mcp = "mfp_sync.mcp_server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mfp_sync*"]

[tool.setuptools.package-data]
mfp_sync = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits the real MyFitnessPal account (needs real credentials; skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # Typer uses function-call defaults (Option/Argument) by design

[tool.coverage.run]
source = ["mfp_sync"]
branch = true
